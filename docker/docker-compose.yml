# ---------------------------------------------------------
# Docker Compose — E-Commerce Admin Portal (Local Dev)
# ---------------------------------------------------------
# Spins up PostgreSQL for local development.
# Usage: docker compose up -d
# ---------------------------------------------------------

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_admin}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Named volume for persistent data across container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin 4 — optional web UI for database inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  # .NET Core API
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-ecommerce_admin};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Gemini__ApiKey=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # Angular Frontend
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ecommerce-web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
