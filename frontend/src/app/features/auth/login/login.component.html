<div class="login-container">
  <mat-card class="login-card">

    <!-- Logo / Brand header -->
    <mat-card-header class="login-header">
      <div class="brand">
        <mat-icon class="brand-icon">storefront</mat-icon>
        <div>
          <h1 class="brand-title">ECommerce Admin</h1>
          <p class="brand-subtitle">Sign in to your account</p>
        </div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" placeholder="admin@example.com" id="email-input">
          <mat-icon matPrefix>email</mat-icon>
          <!-- Show error only when the user has touched the field and left it invalid -->
          <mat-error *ngIf="email?.hasError('required')">Email is required.</mat-error>
          <mat-error *ngIf="email?.hasError('email')">Please enter a valid email address.</mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" id="password-input">
          <mat-icon matPrefix>lock</mat-icon>
          <!-- Toggle between showing/hiding the password -->
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="password?.hasError('required')">Password is required.</mat-error>
          <mat-error *ngIf="password?.hasError('minlength')">Password must be at least 6 characters.</mat-error>
        </mat-form-field>

        <!-- Submit Button with loading spinner -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width login-btn"
          [disabled]="isLoading"
          id="login-button">
          <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Sign In</span>
        </button>

      </form>
    </mat-card-content>

  </mat-card>
</div>
