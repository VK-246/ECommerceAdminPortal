<div class="mb-6 flex items-center justify-between">
  <div>
    <h2 class="text-2xl font-bold text-white tracking-tight">Categories</h2>
    <p class="text-sm text-slate-400 mt-1">Manage your product categories</p>
  </div>
  <button (click)="openForm()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 hover:scale-[1.02] active:scale-[0.98] text-white rounded-full font-medium transition-all shadow-[0_0_15px_rgba(99,102,241,0.3)] hover:shadow-[0_0_20px_rgba(99,102,241,0.5)] flex items-center gap-2">
    <mat-icon style="font-size: 20px; width: 20px; height: 20px;">add</mat-icon> Add Category
  </button>
</div>

<div class="bg-slate-900/60 backdrop-blur-xl border border-white/10 rounded-3xl overflow-hidden shadow-[0_0_40px_-10px_rgba(0,0,0,0.5)]">
  <div class="loading-shade" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="overflow-x-auto">
    <table mat-table [dataSource]="dataSource" class="w-full bg-transparent">

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="text-left text-slate-400 font-semibold text-sm py-4 px-6 border-b border-white/10 bg-white/5"> ID </th>
        <td mat-cell *matCellDef="let element" class="py-4 px-6 !text-amber-400/90 font-mono text-sm border-b border-white/5"> #{{element.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="text-left text-slate-400 font-semibold text-sm py-4 px-6 border-b border-white/10 bg-white/5"> Name </th>
        <td mat-cell *matCellDef="let element" class="py-4 px-6 text-white font-medium border-b border-white/5"> {{element.name}} </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="text-left text-slate-400 font-semibold text-sm py-4 px-6 border-b border-white/10 bg-white/5"> Description </th>
        <td mat-cell *matCellDef="let element" class="py-4 px-6 text-slate-400 border-b border-white/5 truncate max-w-xs"> {{element.description}} </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef class="text-left text-slate-400 font-semibold text-sm py-4 px-6 border-b border-white/10 bg-white/5"> Created At </th>
        <td mat-cell *matCellDef="let element" class="py-4 px-6 text-slate-400 border-b border-white/5 text-sm"> {{element.createdAt | date:'short'}} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right text-slate-400 font-semibold text-sm py-4 px-6 border-b border-white/10 bg-white/5"> Actions </th>
        <td mat-cell *matCellDef="let element" class="py-4 px-6 text-right border-b border-white/5">
          <div class="flex items-center justify-end gap-2">
            <button mat-icon-button (click)="openForm(element)" class="!text-amber-400 hover:!text-amber-300 hover:bg-amber-500/10 transition-colors w-8 h-8 rounded-full flex items-center justify-center" matTooltip="Edit">
              <mat-icon style="font-size: 18px; width: 18px; height: 18px;">edit</mat-icon>
            </button>
            <button mat-icon-button (click)="deleteCategory(element)" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-colors w-8 h-8 rounded-full flex items-center justify-center">
              <mat-icon style="font-size: 18px; width: 18px; height: 18px;">delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-white/5 transition-colors group"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell py-8 text-center text-slate-400" colspan="5">No categories found.</td>
      </tr>
    </table>
  </div>

  <div class="bg-white/5 border-t border-white/10 px-4 py-2">
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons class="bg-transparent text-slate-300"></mat-paginator>
  </div>
</div>
