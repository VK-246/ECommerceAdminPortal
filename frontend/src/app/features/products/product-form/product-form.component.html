<h2 mat-dialog-title>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>

<mat-dialog-content>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" id="productForm">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g., Wireless Mouse">
      <mat-error *ngIf="productForm.get('name')?.hasError('required')">Name is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="categoryId" placeholder="Select Category">
        <mat-option *ngIf="isLoadingCategories">Loading...</mat-option>
        <mat-option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="productForm.get('categoryId')?.hasError('required')">Category is required.</mat-error>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Price ($)</mat-label>
        <input matInput type="number" formControlName="price" min="0" step="0.01">
        <mat-error *ngIf="productForm.get('price')?.hasError('required')">Price is required.</mat-error>
        <mat-error *ngIf="productForm.get('price')?.hasError('min')">Price must be 0 or greater.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Stock Quantity</mat-label>
        <input matInput type="number" formControlName="stockQuantity" min="0" step="1">
        <mat-error *ngIf="productForm.get('stockQuantity')?.hasError('required')">Stock is required.</mat-error>
        <mat-error *ngIf="productForm.get('stockQuantity')?.hasError('min')">Stock must be 0 or greater.</mat-error>
      </mat-form-field>
    </div>

    <div class="ai-description-container">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Product Description</mat-label>
        <textarea matInput formControlName="description" rows="4" placeholder="Enter description or let AI generate it"></textarea>
      </mat-form-field>
      
      <button mat-stroked-button color="accent" type="button" class="ai-btn" 
              (click)="generateAiDescription()" [disabled]="isGeneratingAi">
        <mat-icon>auto_awesome</mat-icon>
        {{ isGeneratingAi ? 'Generating...' : 'Generate AI Description' }}
      </button>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()" [disabled]="isSaving">Cancel</button>
  <button mat-raised-button color="primary" type="submit" form="productForm" [disabled]="productForm.invalid || isSaving">
    {{ isSaving ? 'Saving...' : 'Save' }}
  </button>
</mat-dialog-actions>
