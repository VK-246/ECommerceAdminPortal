name: CI/CD — Test & Deploy to Render

# Trigger: runs on every push to main branch
on:
  push:
    branches:
      - main

jobs:
  # -------------------------------------------------------
  # JOB 1: Automated QA Gate
  # Restores packages and runs all xUnit tests.
  # The deploy job will NOT run if any test fails.
  # -------------------------------------------------------
  test:
    name: Run .NET Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/ECommerce.slnx

      - name: Build solution
        run: dotnet build backend/ECommerce.slnx --no-restore --configuration Release

      - name: Run xUnit tests
        run: dotnet test backend/ECommerce.slnx --no-build --configuration Release --verbosity normal

  # -------------------------------------------------------
  # JOB 2: Deploy to Render
  # Pings Render's deploy hook URLs to trigger a redeploy.
  # Render pulls the latest code from GitHub, rebuilds the
  # Docker image, and swaps the container with zero downtime.
  #
  # Required GitHub Secrets (Settings → Secrets → Actions):
  #   RENDER_API_DEPLOY_HOOK_URL      ← Render API service: Settings → Deploy Hook
  #   RENDER_FRONTEND_DEPLOY_HOOK_URL ← Render Frontend:   Settings → Deploy Hook
  # -------------------------------------------------------
  deploy:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: test  # Only runs if the test job passes ✅

    steps:
      - name: Deploy Backend API
        run: |
          echo "Triggering Render deploy for Backend API..."
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}"
          echo "Backend API deploy triggered."

      - name: Deploy Frontend Static Site
        run: |
          echo "Triggering Render deploy for Frontend..."
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
          echo "Frontend deploy triggered."

      - name: Deployment Summary
        run: |
          echo "Deployment triggered successfully!"
          echo "  API Health:  https://api.vinayak-portfolio.dev/api/health"
          echo "  Frontend:    https://vinayak-portfolio.dev"
