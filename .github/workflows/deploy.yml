name: CI/CD — Test & Deploy to Render

# Trigger: runs on every push to main branch
on:
  push:
    branches:
      - main

jobs:
  # -------------------------------------------------------
  # JOB 1A: Backend QA Gate (.NET Restore, Build, Tests)
  # -------------------------------------------------------
  test-backend:
    name: Run .NET Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/ECommerce.slnx

      - name: Build solution
        run: dotnet build backend/ECommerce.slnx --no-restore --configuration Release

      - name: Run xUnit tests
        run: dotnet test backend/ECommerce.slnx --no-build --configuration Release --verbosity normal

  # -------------------------------------------------------
  # JOB 1B: Frontend QA Gate (Node, NPM Build & Type Check)
  # Catches missing imports, TypeScript errors, and budget issues
  # BEFORE triggering any deploy hooks.
  # -------------------------------------------------------
  test-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular (Production Mode)
        working-directory: frontend
        run: npm run build -- --configuration=production

  # -------------------------------------------------------
  # JOB 2: Deploy to Render
  # Only triggers if BOTH backend and frontend QA gates pass.
  # -------------------------------------------------------
  deploy:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]  # Both must pass ✅

    steps:
      - name: Deploy Backend API
        run: |
          echo "Triggering Render deploy for Backend API..."
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}"
          echo "Backend API deploy triggered."

      - name: Deploy Frontend Static Site
        run: |
          echo "Triggering Render deploy for Frontend..."
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
          echo "Frontend deploy triggered."

      - name: Deployment Summary
        run: |
          echo "Deployment triggered successfully!"
          echo "  API Health:  https://api.vinayak-portfolio.dev/api/health"
          echo "  Frontend:    https://vinayak-portfolio.dev"
